<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant SDK Demo</title>
</head>
<body>
    <h1>AI Assistant SDK Demo</h1>

    <p>Testing the assistant as a general-purpose AI assistant.</p>

    <script
        src="http://localhost:3000/sdk/assistant.js"
        data-assistant-id="default"
        data-api-url="http://localhost:3000"
        data-autoload="true"
        data-greeting="Hello! I am your AI assistant. Ask me anything."
        data-context="You are a helpful general-purpose AI assistant. Answer questions about programming, technology, AI, general knowledge, and other topics. Use conversation history to answer follow-up questions. Do not restrict responses to a particular website or domain.">
    </script>
</body>
</html>
